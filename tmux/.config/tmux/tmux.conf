# Minimalist tmux setup: Vercel / Kanagawa Dragon inspired, independent of nvim.

# General
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -g renumber-windows on
set -g escape-time 10
set -g base-index 1
setw -g pane-base-index 1
setw -g mode-keys vi

# True color and OSC 52 clipboard (nvim's remote_clipboard relies on it).
set -as terminal-features ",*:RGB"
set -g set-clipboard on

# New splits and windows open in the current directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix + r reloads the config.
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Status line: keep it at the top, with a stronger segmented Kanagawa Dragon look.
set -g status-position top
set -g status-justify left

# Restore sessions after a tmux server restart. Install TPM, then press
# prefix + I inside tmux to install these plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Same <C-h/j/k/l> for nvim windows and tmux panes (needs the nvim plugin too).
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'Nybkox/tmux-ukiyo'

# Ukiyo: colored powerline segments, with a curated theme menu (no Catppuccin).
set -g @ukiyo-theme "kanagawa/dragon"
set -g @ukiyo-show-powerline true
set -g @ukiyo-transparent-powerline-bg false
set -g @ukiyo-border-contrast true
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "ssh-session git time"
set -g @ukiyo-show-empty-plugins false
set -g @ukiyo-ssh-session-short-hostname true
set -g @ukiyo-show-ssh-session-port false
set -g @ukiyo-military-time true
set -g @ukiyo-show-timezone false
set -g @ukiyo-time-format "%a %d.%m %H:%M"
set -g @ukiyo-menu-key none

set -g @continuum-restore 'on'

# Pick a theme with prefix + T. The matching Neovim colorscheme can be selected
# separately; Lualine keeps the same segmented shape and follows that palette.
bind-key T display-menu -T "Theme" -x C -y P "Vercel" v "run-shell -b '~/.config/tmux/switch-theme.sh vercel'" "Kanagawa Dragon" k "run-shell -b '~/.config/tmux/switch-theme.sh kanagawa/dragon'" "Kanagawa Wave" w "run-shell -b '~/.config/tmux/switch-theme.sh kanagawa/wave'" "Kanagawa Lotus" l "run-shell -b '~/.config/tmux/switch-theme.sh kanagawa/lotus'" "Tokyo Night" t "run-shell -b '~/.config/tmux/switch-theme.sh tokyonight/night'" "Nord" n "run-shell -b '~/.config/tmux/switch-theme.sh nord/default'" "Gruvbox Dark" g "run-shell -b '~/.config/tmux/switch-theme.sh gruvbox/dark'"

# Keep the config usable before TPM has been installed. When present, load TPM
# and then restore the last selected palette.
if-shell '[ -f "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell -b "$HOME/.tmux/plugins/tpm/tpm && $HOME/.config/tmux/switch-theme.sh --restore"'
