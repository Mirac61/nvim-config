# Minimalist tmux setup: Vercel / Kanagawa Dragon inspired, independent of nvim.

# General
set -g mouse on
set -g history-limit 100000
set -g focus-events on
set -g renumber-windows on
set -g escape-time 10

# Status line: move it away from Neovim's own bottom statusline and let the
# terminal background show through, so the two bars do not look stacked.
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 40

set -g status-style "bg=default,fg=#71717a"
set -g message-style "bg=#18181b,fg=#d4d4d8"
set -g message-command-style "bg=#18181b,fg=#d4d4d8"
set -g pane-border-style "fg=#27272a"
set -g pane-active-border-style "fg=#8ba4b0"

# Plain text only: subdued inactive windows, one quiet accent for the active one.
set -g status-left "#[fg=#71717a]#S#[default]"
set -g window-status-format "#[fg=#52525b]#I:#W#{?window_zoomed_flag, (zoom),}#[default]"
set -g window-status-current-format "#[fg=#8ba4b0,bold]#I:#W#{?window_zoomed_flag, (zoom),}#[default]"
set -g window-status-separator "  "
set -g window-status-activity-style "fg=#e6c384,bold"
set -g window-status-bell-style "fg=#ffa066,bold"

# Short host is useful when tmux itself runs over SSH; the path is omitted
# because it is often redundant and can be misleading inside SSH panes.
set -g status-right "#[fg=#52525b]#{=13:host}  #[fg=#71717a]%H:%M#[default] "

# Restore sessions after a tmux server restart. Install TPM, then press
# prefix + I inside tmux to install these plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Keep the config usable before TPM has been installed.
if-shell '[ -f "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
